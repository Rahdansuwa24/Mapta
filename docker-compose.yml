services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "${PORT_HTTP:-8065}:${PORT_HTTP:-8065}"
    environment:
      - DOMAIN=${DOMAIN:-mapta-rahdan.duckdns.org}
      - PORT_HTTP=${PORT_HTTP:-8065}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend/kp
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DOMAIN=${DOMAIN:-mapta-rahdan.duckdns.org}
      - PORT_HTTP=${PORT_HTTP:-8065}
      - CORS_ORIGIN=https://${DOMAIN:-mapta-rahdan.duckdns.org},http://${DOMAIN:-mapta-rahdan.duckdns.org}:${PORT_HTTP:-8065},http://localhost:${PORT_HTTP:-8065}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend/kp
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
        - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID:-}
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
